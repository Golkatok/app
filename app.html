<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSeek Builder</title>
<style>
:root {
  --bg-base: #131417;
  --bg-sidebar: #1e1f22;
  --bg-input: #2b2d31;
  --bg-msg-user: #2b2d31;
  --text-main: #e3e5e8;
  --text-muted: #949ba4;
  --accent: #4d6bfe;
  --border: #313338;
  --danger: #f23f43;
  --code-bg: #1e1e1e;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-base); color: var(--text-main); }

#app { display: flex; height: 100vh; width: 100vw; }

/* Sidebar */
#sidebar {
  width: 260px; min-width: 200px; max-width: 400px; flex-shrink: 0;
  background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border);
}
.sidebar-header { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.logo-area { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: #fff; }
.logo-area svg { width: 24px; height: 24px; fill: var(--accent); }
.btn-new {
  background: var(--bg-input); border-radius: 24px; padding: 10px 16px; display: flex;
  align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 14px; cursor: pointer;
  border: 1px solid transparent; transition: 0.2s;
}
.btn-new:hover { background: var(--border); }
.search-box {
  background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; display: flex; align-items: center; gap: 8px;
}
.search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13px; }
.search-box input::placeholder { color: var(--text-muted); }

.chat-list { flex: 1; overflow-y: auto; padding: 12px; }
.chat-group { margin-bottom: 20px; }
.chat-group-title { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; padding-left: 8px; }
.chat-item {
  padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between;
  align-items: center; font-size: 14px; color: var(--text-main); margin-bottom: 2px; transition: 0.1s;
}
.chat-item:hover, .chat-item.active { background: var(--bg-input); }
.chat-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.chat-item .del-btn { opacity: 0; color: var(--text-muted); padding: 0 4px; font-weight: bold; }
.chat-item:hover .del-btn { opacity: 1; }
.chat-item .del-btn:hover { color: var(--danger); }

.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.sidebar-footer input, .sidebar-footer select {
  background: var(--bg-base); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px;
  color: #fff; font-size: 13px; outline: none; width: 100%;
}
.sidebar-footer button { background: var(--bg-input); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; }
.sidebar-footer button:hover { background: var(--border); }

/* Resizer */
.resizer { width: 4px; cursor: col-resize; background: transparent; z-index: 100; transition: background 0.1s; }
.resizer:hover, .resizer.active { background: var(--accent); }

/* Main Chat */
#main-chat { flex: 1; display: flex; flex-direction: column; min-width: 300px; }
.top-bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
.top-bar .title { font-weight: 600; font-size: 16px; }
.icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { color: var(--text-main); }

#messages-container { flex: 1; overflow-y: auto; padding: 24px 0; scroll-behavior: smooth; }
.msg-wrapper { max-width: 800px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 20px; }

.msg { display: flex; flex-direction: column; max-width: 100%; }
.msg.user { align-items: flex-end; }
.msg.assistant { align-items: flex-start; }
.msg-bubble {
  padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.6;
  word-wrap: break-word; white-space: pre-wrap; max-width: 85%;
}
.msg.user .msg-bubble { background: var(--bg-msg-user); border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: transparent; padding: 0; max-width: 100%; }

pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: #d4d4d4; }
.msg-bubble p { margin: 0 0 10px 0; }
.msg-bubble p:last-child { margin: 0; }

.reasoning-block { margin-bottom: 16px; background: rgba(255,255,255,0.03); border-left: 2px solid var(--accent); border-radius: 4px; padding: 12px 16px; font-size: 14px; color: var(--text-muted); }
.reasoning-block summary { cursor: pointer; font-weight: 600; outline: none; }
.reasoning-text { margin-top: 8px; font-family: monospace; white-space: pre-wrap; }

.attach-preview { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 0 8px 0; }
.attach-chip { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.attach-chip img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }

.input-container-outer { padding: 0 24px 24px 24px; max-width: 850px; margin: 0 auto; width: 100%; }
.input-box {
  background: var(--bg-input); border-radius: 24px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
  border: 1px solid transparent; transition: border-color 0.2s;
}
.input-box:focus-within { border-color: var(--border); }
.input-top { display: flex; flex-wrap: wrap; gap: 8px; }
.input-bottom { display: flex; align-items: flex-end; gap: 12px; }
#user-input {
  flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; resize: none;
  max-height: 200px; min-height: 24px; outline: none; padding: 4px 0;
}
#user-input::placeholder { color: var(--text-muted); }

.tool-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-muted);
  padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: 0.2s;
}
.tool-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
.tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.btn-send {
  background: var(--accent); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.btn-send:disabled { background: var(--bg-sidebar); color: var(--text-muted); cursor: not-allowed; }

#preview-panel { width: 40%; min-width: 300px; flex-shrink: 0; background: var(--bg-base); display: flex; flex-direction: column; }
.preview-header { display: flex; padding: 0 16px; border-bottom: 1px solid var(--border); height: 60px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 20px; height: 100%; }
.tab { height: 100%; display: flex; align-items: center; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; }
.tab.active { color: #fff; border-bottom-color: var(--accent); }
#preview-iframe { flex: 1; border: none; background: #fff; width: 100%; }
#code-editor { flex: 1; background: var(--code-bg); color: #d4d4d4; border: none; padding: 16px; font-family: monospace; resize: none; outline: none; display: none; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal.open { display: flex; }
.modal-content { background: var(--bg-sidebar); width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.modal-content h3 { margin: 0; font-size: 18px; }
.modal-content textarea { background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; min-height: 120px; resize: vertical; outline: none; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
.btn-cancel { background: var(--bg-input); color: #fff; }
.btn-save { background: var(--accent); color: #fff; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4a4e56; }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo-area">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        DeepSeek Builder
      </div>
      <button class="btn-new" id="btn-new-chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="Search chats..." id="search-input" />
      </div>
    </div>
    <div class="chat-list" id="chat-list"></div>
    <div class="sidebar-footer">
      <input type="password" id="api-key" placeholder="DeepSeek API Key" />
      <select id="model-select">
        <option value="deepseek-chat">deepseek-chat</option>
        <option value="deepseek-reasoner">deepseek-reasoner</option>
        <option value="deepseek-flash">deepseek-flash (Vision)</option>
      </select>
      <button id="btn-custom-prompt">⚙️ Custom Instructions</button>
    </div>
  </aside>

  <div class="resizer" id="resizer-left"></div>

  <main id="main-chat">
    <div class="top-bar">
      <div class="title" id="current-chat-title">Новый чат</div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-toggle-preview" title="Toggle Preview">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
    </div>

    <div id="messages-container">
      <div class="msg-wrapper" id="messages"></div>
    </div>

    <div class="input-container-outer">
      <div class="input-box">
        <div class="attach-preview" id="attachment-preview"></div>
        <div class="input-top">
          <!-- Кнопка DeepThink -->
          <button class="tool-btn" id="btn-think" title="Режим размышления (R1)">🧠 DeepThink</button>
          <button class="tool-btn" id="btn-img-gen" title="Генерация HTML Canvas">🖼️ Canvas</button>
        </div>
        <div class="input-bottom">
          <button class="icon-btn" id="btn-attach" title="Attach File">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" multiple style="display:none" />
          <textarea id="user-input" placeholder="Message DeepSeek..." rows="1"></textarea>
          <button class="btn-send" id="btn-send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="resizer" id="resizer-right"></div>

  <section id="preview-panel">
    <div class="preview-header">
      <div class="tabs">
        <div class="tab active" data-tab="preview">Preview</div>
        <div class="tab" data-tab="code">Code</div>
      </div>
      <button class="tool-btn" id="btn-download">Download</button>
    </div>
    <iframe id="preview-iframe" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
    <textarea id="code-editor" spellcheck="false"></textarea>
  </section>
</div>

<div class="modal" id="modal-custom">
  <div class="modal-content">
    <h3>Custom Instructions</h3>
    <textarea id="custom-prompt-text" placeholder="Эти инструкции добавляются в конец системного промпта..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-custom-cancel">Отмена</button>
      <button class="btn-save" id="btn-custom-save">Сохранить</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const LS = { key: 'ds_key', model: 'ds_model', custom: 'ds_custom', chats: 'ds_chats', curr: 'ds_curr' };
const EMPTY_PREVIEW = '<!doctype html><html><body style="font-family:sans-serif;color:#888;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#fff">Ожидание кода...</body></html>';

const DEFAULT_SYSTEM = `Ты — ИИ-ассистент по имени DeepSeek. Ты создаёшь и редактируешь HTML/CSS/JS проекты.
Инструменты:
- read_file: прочитать текущий HTML.
- write_file: записать файл целиком (только если пусто).
- edit_file: заменить точный фрагмент (old_string -> new_string). Только точечные правки.
Отвечай на русском. Если пишешь код, используй Markdown-блоки \`\`\`html ... \`\`\`.`;

const IMG_SYSTEM = `Ты — генератор изображений на HTML5 Canvas. Твоя задача — написать ПОЛНЫЙ рабочий HTML-код, который рисует запрошенное пользователем с помощью <canvas> и JavaScript. Не используй внешние картинки, только код.
Обязательно оберни весь HTML-код в блок \`\`\`html ... \`\`\` целиком.`;

const TOOLS = [
  { type: 'function', function: { name: 'read_file', description: 'Прочитать HTML.', parameters: { type: 'object', properties: {}, required: [] } } },
  { type: 'function', function: { name: 'write_file', description: 'Записать файл (только если пуст).', parameters: { type: 'object', properties: { content: { type: 'string' } }, required: ['content'] } } },
  { type: 'function', function: { name: 'edit_file', description: 'Заменить фрагмент.', parameters: { type: 'object', properties: { old_string: { type: 'string' }, new_string: { type: 'string' }, replace_all: { type: 'boolean' } }, required: ['old_string', 'new_string'] } } }
];

const state = {
  apiKey: localStorage.getItem(LS.key) || '',
  model: localStorage.getItem(LS.model) || 'deepseek-chat',
  customPrompt: localStorage.getItem(LS.custom) || '',
  chats: [],
  currentId: localStorage.getItem(LS.curr) || '',
  messages: [],
  file: '',
  busy: false
};

let pendingAttachments = [];
let currentController = null;
let streamRaf = null;
let isImageGenMode = false;

const $ = s => document.querySelector(s);

function setupResizers() {
  const sidebar = $('#sidebar'), preview = $('#preview-panel');
  const resLeft = $('#resizer-left'), resRight = $('#resizer-right');

  const initResize = (e, leftEl, rightEl, isRight) => {
    e.preventDefault();
    document.body.style.cursor = 'col-resize';
    e.target.classList.add('active');
    const startX = e.clientX;
    const startLeftWidth = leftEl.getBoundingClientRect().width;
    const startRightWidth = rightEl.getBoundingClientRect().width;

    const onMouseMove = (moveEvent) => {
      const dx = moveEvent.clientX - startX;
      if (isRight) {
        let newWidth = startRightWidth - dx;
        if (newWidth > 300 && newWidth < window.innerWidth - 400) { rightEl.style.width = newWidth + 'px'; }
      } else {
        let newWidth = startLeftWidth + dx;
        if (newWidth > 200 && newWidth < 450) { leftEl.style.width = newWidth + 'px'; }
      }
    };
    const onMouseUp = () => {
      document.body.style.cursor = '';
      e.target.classList.remove('active');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    };
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  };
  resLeft.addEventListener('mousedown', (e) => initResize(e, sidebar, null, false));
  resRight.addEventListener('mousedown', (e) => initResize(e, null, preview, true));
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

function saveState() {
  try {
    localStorage.setItem(LS.key, state.apiKey); localStorage.setItem(LS.model, state.model);
    localStorage.setItem(LS.custom, state.customPrompt); localStorage.setItem(LS.curr, state.currentId);
  } catch(e){}
  const chat = state.chats.find(c => c.id === state.currentId);
  if (chat) { chat.messages = state.messages; chat.file = state.file; chat.updatedAt = Date.now(); }

  const clean = state.chats.map(c => ({
    ...c, messages: c.messages.map(m => {
      let content = m.content;
      if (Array.isArray(content)) content = content.map(p => p.type === 'image_url' ? { type: 'image_url', image_url: { url: '[IMG]' } } : p);
      const cm = { ...m, content }; delete cm._streaming;
      if (cm.tool_calls && cm.tool_calls.length === 0) delete cm.tool_calls;
      if (m._attachments) {
        const att = m._attachments.filter(a => a.type !== 'image');
        if (att.length) cm._attachments = att; else delete cm._attachments;
      }
      return cm;
    })
  }));

  let str = JSON.stringify(clean);
  for (let i=0; i<10; i++) {
    try { localStorage.setItem(LS.chats, str); return; } 
    catch { if (clean.length <= 1) return; clean.pop(); str = JSON.stringify(clean); }
  }
}

function loadState() {
  try { state.chats = JSON.parse(localStorage.getItem(LS.chats) || '[]'); } catch { state.chats = []; }
  if (!Array.isArray(state.chats)) state.chats = [];
  if (!state.chats.length) {
    state.chats.push({ id: genId(), title: 'Новый чат', messages: [], file: '', updatedAt: Date.now() });
    state.currentId = state.chats[0].id;
  } else if (!state.chats.find(c => c.id === state.currentId)) {
    state.currentId = state.chats[0].id;
  }
  const active = state.chats.find(c => c.id === state.currentId);
  state.messages = active.messages || []; state.file = active.file || '';
  state.messages.forEach(m => {
    if (Array.isArray(m.content)) m.content = m.content.map(p => p.image_url && p.image_url.url === '[IMG]' ? { type: 'image_url', image_url: { url: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' } } : p);
  });
}

function renderChatList() {
  const list = $('#chat-list'); list.innerHTML = '';
  const groups = { 'Сегодня': [], 'Вчера': [], 'Ранее': [] };
  const now = new Date();
  [...state.chats].sort((a,b) => b.updatedAt - a.updatedAt).forEach(c => {
    const d = new Date(c.updatedAt || 0);
    if (d.toDateString() === now.toDateString()) groups['Сегодня'].push(c);
    else if (d.getTime() > now.getTime() - 86400000) groups['Вчера'].push(c);
    else groups['Ранее'].push(c);
  });

  for (const [title, items] of Object.entries(groups)) {
    if (!items.length) continue;
    const g = document.createElement('div'); g.className = 'chat-group';
    g.innerHTML = `<div class="chat-group-title">${title}</div>`;
    items.forEach(c => {
      const el = document.createElement('div');
      el.className = 'chat-item' + (c.id === state.currentId ? ' active' : '');
      el.innerHTML = `<span class="title">${c.title}</span><span class="del-btn">×</span>`;
      el.onclick = (e) => { if (!e.target.classList.contains('del-btn')) switchChat(c.id); };
      el.querySelector('.del-btn').onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
      g.appendChild(el);
    });
    list.appendChild(g);
  }
}

function switchChat(id) {
  if (state.busy) { if (!confirm('Прервать генерацию?')) return; if (currentController) currentController.abort(); }
  saveState(); state.currentId = id;
  const chat = state.chats.find(c => c.id === id);
  state.messages = chat.messages || []; state.file = chat.file || '';
  $('#current-chat-title').textContent = chat.title;
  renderChatList(); renderMessages(); setFile(state.file, true); saveState();
}

function createNewChat() {
  saveState(); const id = genId();
  state.chats.unshift({ id, title: 'Новый чат', messages: [], file: '', updatedAt: Date.now() });
  switchChat(id);
}

function deleteChat(id) {
  if (state.chats.length === 1) return alert('Последний чат нельзя удалить.');
  state.chats = state.chats.filter(c => c.id !== id);
  if (state.currentId === id) switchChat(state.chats[0].id); else renderChatList();
  saveState();
}

function formatText(text) {
  if (!text) return '';
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code class="language-${lang}">${code}</code></pre>`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  return html;
}

function buildMessageNode(m) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${m.role}`;
  if (m._streaming) wrap.classList.add('streaming');

  if (m.role === 'user') {
    let html = '';
    if (m._attachments && m._attachments.length) html += '<div class="attach-preview">' + m._attachments.map(a => a.type === 'image' ? `<img src="${a.content}">` : `<div class="attach-chip">📄 ${a.name}</div>`).join('') + '</div>';
    if (Array.isArray(m.content)) html += m.content.filter(x => x.type === 'text').map(x => x.text).join('\n');
    else html += m.content || '';
    const c = document.createElement('div'); c.className = 'msg-bubble'; c.innerHTML = html;
    wrap.appendChild(c); return wrap;
  }

  if (m.role === 'assistant') {
    if (m.reasoning_content) {
      const det = document.createElement('details');
      det.className = 'reasoning-block';
      det.innerHTML = `<summary>🧠 Размышление</summary><div class="reasoning-text">${m.reasoning_content}</div>`;
      wrap.appendChild(det);
    }
    const c = document.createElement('div'); c.className = 'msg-bubble';
    c.innerHTML = formatText(m.content || ''); wrap.appendChild(c);
    return wrap;
  }
  return wrap;
}

function renderMessages() {
  const box = $('#messages'); box.innerHTML = '';
  if (!state.messages.length) return;
  state.messages.forEach(m => { if (m.role !== 'system' && m.role !== 'tool') box.appendChild(buildMessageNode(m)); });
  scrollToBottom();
}

function scrollToBottom() { const container = $('#messages-container'); container.scrollTop = container.scrollHeight; }

function updateStreamingMessage() {
  const box = $('#messages'), node = box.querySelector('.msg.assistant.streaming');
  if (!node) return;
  const m = state.messages[state.messages.length - 1];
  if (!m || !m._streaming) return;

  if (m.reasoning_content) {
    let r = node.querySelector('.reasoning-text');
    if (!r) {
      const det = document.createElement('details'); det.className = 'reasoning-block';
      det.innerHTML = `<summary>🧠 Размышление</summary><div class="reasoning-text"></div>`;
      node.insertBefore(det, node.firstChild); r = det.querySelector('.reasoning-text');
    }
    if (r.textContent !== m.reasoning_content) r.textContent = m.reasoning_content;
  }
  let c = node.querySelector('.msg-bubble');
  if (!c) { c = document.createElement('div'); c.className = 'msg-bubble'; node.appendChild(c); }
  c.innerHTML = formatText(m.content || '');
  scrollToBottom();
}

function scheduleStreamUpdate() {
  if (streamRaf) return;
  streamRaf = requestAnimationFrame(() => { streamRaf = null; updateStreamingMessage(); });
}

function setFile(content, force = false) {
  state.file = content; saveState();
  if (document.activeElement !== $('#code-editor')) $('#code-editor').value = content;
  if (force || $('#preview-iframe').srcdoc !== content) $('#preview-iframe').srcdoc = content || EMPTY_PREVIEW;
}

function extractAndSetHtml(text) {
  if (!text) return;
  const regex = /```(?:html)?\s*\n([\s\S]*?)```/i;
  const match = text.match(regex);
  if (match && match[1]) {
    const code = match[1].trim();
    if (code.includes('<') && code.includes('>')) {
      setFile(code);
    }
  }
}

function executeTool(name, args) {
  try {
    if (name === 'read_file') return state.file || '(пусто)';
    if (name === 'write_file') { setFile(args.content || ''); return 'OK'; }
    if (name === 'edit_file') {
      const oldStr = args.old_string || '', idx = state.file.indexOf(oldStr);
      if (idx === -1) return 'ОШИБКА: не найдено';
      if (!args.replace_all && state.file.indexOf(oldStr, idx + 1) !== -1) return 'ОШИБКА: несколько вхождений';
      setFile(state.file.split(oldStr).join(args.new_string || '')); return 'OK';
    }
    return 'ОШИБКА: неизвестный инструмент';
  } catch(e) { return 'ОШИБКА: ' + e.message; }
}

function sanitizeMessages(msgs) {
  const out = [];
  for (let i=0; i<msgs.length; i++) {
    const m = msgs[i];
    if (m._streaming || m.role === 'tool') continue;
    
    if (m.role === 'assistant') {
      const c = { role: 'assistant', content: m.content || '' };
      if (m.tool_calls && m.tool_calls.length > 0) {
        const next = msgs.slice(i+1, i+1+m.tool_calls.length);
        if (next.every((n, idx) => n.role === 'tool' && n.tool_call_id === m.tool_calls[idx].id)) {
          c.tool_calls = m.tool_calls; out.push(c, ...next); i += m.tool_calls.length;
        } else {
          out.push({ role: 'assistant', content: (m.content||'') + ' [действие отменено]' });
        }
      } else {
        out.push(c);
      }
    } else {
      out.push({ role: m.role, content: m.content });
    }
  }
  return out;
}

async function streamApiCall(onDelta, signal) {
  if (!state.apiKey) throw new Error('Укажите API Key в левой панели');
  let system = isImageGenMode ? IMG_SYSTEM : DEFAULT_SYSTEM;
  if (state.customPrompt.trim()) system += '\n\n' + state.customPrompt.trim();

  const body = {
    model: state.model, messages: [{ role: 'system', content: system }, ...sanitizeMessages(state.messages)],
    temperature: 0.7, stream: true
  };
  if (!isImageGenMode) { body.tools = TOOLS; body.tool_choice = 'auto'; }

  const resp = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.apiKey },
    body: JSON.stringify(body), signal
  });
  if (!resp.ok) throw new Error('API ' + resp.status + ': ' + (await resp.text()).slice(0, 200));

  const reader = resp.body.getReader(), decoder = new TextDecoder();
  let buffer = '', content = '', reasoning = '';
  const toolCalls = [];

  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n'); buffer = lines.pop();
    for (const line of lines) {
      const trimmed = line.trim(); if (!trimmed.startsWith('data: ')) continue;
      const data = trimmed.slice(6).trim(); if (!data || data === '[DONE]') continue;
      try {
        const json = JSON.parse(data), delta = json.choices?.[0]?.delta || {};
        if (delta.reasoning_content) { reasoning += delta.reasoning_content; onDelta({ type: 'reasoning', full: reasoning }); }
        if (delta.content) { content += delta.content; onDelta({ type: 'content', full: content }); }
        if (delta.tool_calls) {
          for (const tc of delta.tool_calls) {
            const idx = tc.index ?? 0;
            if (!toolCalls[idx]) toolCalls[idx] = { id: '', type: 'function', function: { name: '', arguments: '' } };
            if (tc.id) toolCalls[idx].id = tc.id;
            if (tc.function?.name) toolCalls[idx].function.name += tc.function.name;
            if (tc.function?.arguments) toolCalls[idx].function.arguments += tc.function.arguments;
          }
          onDelta({ type: 'tool_calls', tool_calls: toolCalls.filter(Boolean) });
        }
      } catch {}
    }
  }
  
  const msg = { role: 'assistant', content };
  if (reasoning) msg.reasoning_content = reasoning;
  if (toolCalls.length > 0) msg.tool_calls = toolCalls.filter(Boolean);
  
  return msg;
}

async function runAgent() {
  if (state.busy) return;
  state.busy = true; $('#btn-send').disabled = true;
  currentController = new AbortController();

  try {
    for (let step = 0; step < 20; step++) {
      const placeholder = { role: 'assistant', content: '', _streaming: true };
      state.messages.push(placeholder); renderMessages();

      const msg = await streamApiCall(delta => {
        if (delta.type === 'reasoning') placeholder.reasoning_content = delta.full;
        else if (delta.type === 'content') placeholder.content = delta.full;
        else if (delta.type === 'tool_calls') placeholder.tool_calls = delta.tool_calls;
        scheduleStreamUpdate();
      }, currentController.signal);

      state.messages[state.messages.length - 1] = msg;
      renderMessages(); saveState();

      if (msg.tool_calls && msg.tool_calls.length) {
        for (const tc of msg.tool_calls) {
          let args = {}; try { args = JSON.parse(tc.function.arguments || '{}'); } catch {}
          const result = executeTool(tc.function.name, args);
          state.messages.push({ role: 'tool', tool_call_id: tc.id, content: result });
        }
        renderMessages();
      } else {
        extractAndSetHtml(msg.content);
        break;
      }
    }
  } catch (e) {
    state.messages.push({ role: 'assistant', content: '⚠️ Ошибка: ' + e.message }); renderMessages();
  } finally {
    state.busy = false; $('#btn-send').disabled = false;
    currentController = null; saveState();
  }
}

function send() {
  if (state.busy) { if (currentController) currentController.abort(); return; }
  const ta = $('#user-input'), text = ta.value.trim();
  if (!text && !pendingAttachments.length) return;

  const chat = state.chats.find(c => c.id === state.currentId);
  if (chat.title === 'Новый чат' && state.messages.length === 0) {
    chat.title = text.slice(0, 30) || 'Медиа';
    $('#current-chat-title').textContent = chat.title; renderChatList();
  }

  let textPart = isImageGenMode ? "Напиши HTML Canvas код для: " + text : text;
  const imgs = [];
  pendingAttachments.forEach(a => {
    if (a.type === 'text') textPart += `\n\nФайл ${a.name}:\n\`\`\`\n${a.content}\n\`\`\``;
    else if (a.type === 'image') imgs.push(a);
  });

  let finalContent = imgs.length ? [{ type: 'text', text: textPart }] : textPart;
  imgs.forEach(img => finalContent.push({ type: 'image_url', image_url: { url: img.content } }));

  ta.value = ''; ta.style.height = 'auto';
  state.messages.push({ role: 'user', content: finalContent, _attachments: [...pendingAttachments] });
  pendingAttachments = []; renderAttachments(); renderMessages(); saveState();
  runAgent();
}

function renderAttachments() {
  const box = $('#attachment-preview');
  box.innerHTML = pendingAttachments.map((a, i) => 
    a.type === 'image' ? `<div class="attach-chip"><img src="${a.content}"> <span style="cursor:pointer" onclick="removeAtt(${i})">×</span></div>`
    : `<div class="attach-chip">📄 ${a.name} <span style="cursor:pointer" onclick="removeAtt(${i})">×</span></div>`
  ).join('');
}
window.removeAtt = i => { pendingAttachments.splice(i, 1); renderAttachments(); };

// --- СИНХРОНИЗАЦИЯ КНОПКИ DEEPTHINK ---
function syncModelUI() {
  const isReasoner = state.model === 'deepseek-reasoner';
  $('#btn-think').classList.toggle('active', isReasoner);
  $('#model-select').value = state.model;
}

$('#btn-think').onclick = () => {
  state.model = (state.model === 'deepseek-reasoner') ? 'deepseek-chat' : 'deepseek-reasoner';
  syncModelUI();
  saveState();
};

$('#btn-new-chat').onclick = createNewChat;
$('#api-key').value = state.apiKey; 
$('#api-key').oninput = e => { state.apiKey = e.target.value.trim(); saveState(); };

$('#model-select').onchange = e => { 
  state.model = e.target.value; 
  syncModelUI(); 
  saveState(); 
};

$('#user-input').oninput = function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; };
$('#user-input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
$('#btn-send').onclick = send;

$('#user-input').addEventListener('paste', e => {
  const items = e.clipboardData?.items; if (!items) return;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.includes('image')) {
      e.preventDefault(); const file = items[i].getAsFile(); const reader = new FileReader();
      reader.onload = ev => { pendingAttachments.push({ type: 'image', name: 'Pasted Image', content: ev.target.result }); renderAttachments(); };
      reader.readAsDataURL(file);
    }
  }
});

$('#btn-attach').onclick = () => $('#file-input').click();
$('#file-input').onchange = e => {
  for (const f of e.target.files) {
    const reader = new FileReader();
    reader.onload = ev => { pendingAttachments.push({ type: f.type.startsWith('image/') ? 'image' : 'text', name: f.name, content: ev.target.result }); renderAttachments(); };
    if (f.type.startsWith('image/')) reader.readAsDataURL(f); else reader.readAsText(f);
  }
  e.target.value = '';
};

$('#btn-img-gen').onclick = () => {
  isImageGenMode = !isImageGenMode;
  $('#btn-img-gen').classList.toggle('active', isImageGenMode);
  $('#user-input').placeholder = isImageGenMode ? "Опишите картинку (Canvas)..." : "Message DeepSeek...";
};

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
    const isCode = t.dataset.tab === 'code';
    $('#preview-iframe').style.display = isCode ? 'none' : 'block';
    $('#code-editor').style.display = isCode ? 'block' : 'none';
    if (isCode) $('#code-editor').value = state.file;
  };
});

$('#code-editor').oninput = e => { setFile(e.target.value); saveState(); };

$('#btn-toggle-preview').onclick = () => {
  const p = $('#preview-panel');
  if (p.style.display === 'none') { p.style.display = 'flex'; $('#resizer-right').style.display = 'block'; }
  else { p.style.display = 'none'; $('#resizer-right').style.display = 'none'; }
};

$('#btn-download').onclick = () => {
  if (!state.file) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([state.file], {type:'text/html'}));
  a.download = 'project.html'; a.click();
};

$('#btn-custom-prompt').onclick = () => { $('#custom-prompt-text').value = state.customPrompt; $('#modal-custom').classList.add('open'); };
$('#btn-custom-cancel').onclick = () => $('#modal-custom').classList.remove('open');
$('#btn-custom-save').onclick = () => { state.customPrompt = $('#custom-prompt-text').value; saveState(); $('#modal-custom').classList.remove('open'); };

function init() { 
  setupResizers(); 
  loadState(); 
  renderChatList(); 
  renderMessages(); 
  syncModelUI(); // Применяем состояние кнопки DeepThink при запуске
  setFile(state.file, true); 
}
init();

})();
</script>
